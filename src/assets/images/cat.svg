<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 고양이 몸체 -->
  <ellipse cx="100" cy="130" rx="40" ry="25" fill="#FF9500" stroke="#FF7A00" stroke-width="2"/>
  
  <!-- 고양이 머리 -->
  <circle cx="100" cy="80" r="35" fill="#FF9500" stroke="#FF7A00" stroke-width="2"/>
  
  <!-- 고양이 귀 -->
  <path d="M 75 55 L 80 35 L 95 50 Z" fill="#FF9500" stroke="#FF7A00" stroke-width="2"/>
  <path d="M 105 50 L 120 35 L 125 55 Z" fill="#FF9500" stroke="#FF7A00" stroke-width="2"/>
  
  <!-- 귀 안쪽 -->
  <path d="M 78 50 L 82 40 L 90 48 Z" fill="#FFB84D"/>
  <path d="M 110 48 L 118 40 L 122 50 Z" fill="#FFB84D"/>
  
  <!-- 고양이 눈 -->
  <ellipse cx="88" cy="75" rx="6" ry="8" fill="#000"/>
  <ellipse cx="112" cy="75" rx="6" ry="8" fill="#000"/>
  <ellipse cx="90" cy="73" rx="2" ry="3" fill="#FFF"/>
  <ellipse cx="114" cy="73" rx="2" ry="3" fill="#FFF"/>
  
  <!-- 고양이 코 -->
  <path d="M 100 85 L 95 90 L 105 90 Z" fill="#FFB84D"/>
  
  <!-- 고양이 입 -->
  <path d="M 100 92 Q 95 95 90 92" stroke="#FF7A00" stroke-width="2" fill="none"/>
  <path d="M 100 92 Q 105 95 110 92" stroke="#FF7A00" stroke-width="2" fill="none"/>
  
  <!-- 고양이 수염 -->
  <line x1="65" y1="80" x2="85" y2="82" stroke="#FF7A00" stroke-width="2"/>
  <line x1="65" y1="85" x2="85" y2="85" stroke="#FF7A00" stroke-width="2"/>
  <line x1="65" y1="90" x2="85" y2="88" stroke="#FF7A00" stroke-width="2"/>
  
  <line x1="115" y1="82" x2="135" y2="80" stroke="#FF7A00" stroke-width="2"/>
  <line x1="115" y1="85" x2="135" y2="85" stroke="#FF7A00" stroke-width="2"/>
  <line x1="115" y1="88" x2="135" y2="90" stroke="#FF7A00" stroke-width="2"/>
  
  <!-- 고양이 앞발 -->
  <ellipse cx="80" cy="150" rx="8" ry="15" fill="#FF9500" stroke="#FF7A00" stroke-width="2"/>
  <ellipse cx="120" cy="150" rx="8" ry="15" fill="#FF9500" stroke="#FF7A00" stroke-width="2"/>
  
  <!-- 고양이 뒷발 -->
  <ellipse cx="75" cy="155" rx="6" ry="10" fill="#FF9500" stroke="#FF7A00" stroke-width="2"/>
  <ellipse cx="125" cy="155" rx="6" ry="10" fill="#FF9500" stroke="#FF7A00" stroke-width="2"/>
  
  <!-- 고양이 꼬리 -->
  <path d="M 140 130 Q 160 120 170 100 Q 175 85 165 70" stroke="#FF7A00" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- 배 무늬 -->
  <ellipse cx="100" cy="125" rx="15" ry="8" fill="#FFB84D"/>
</svg>